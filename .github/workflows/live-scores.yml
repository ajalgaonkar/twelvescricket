name: Fetch Live Scores

on:
  schedule:
    # Every 5 minutes on Sat & Sun between 10 AM - 8 PM Pacific (17:00 - 03:00 UTC)
    - cron: "*/5 17-23 * * 6,0"
    - cron: "*/5 0-3 * * 0,1"
  workflow_dispatch:

jobs:
  fetch-scores:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      - name: Fetch live scores
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npx tsx scripts/fetch-live-scores.ts
